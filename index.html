<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>For You, My Love 💌</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Dancing+Script:wght@600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --rose: #c0393b;
        --blush: #f7cac9;
        --gold: #c9a84c;
        --cream: #fdf6ec;
        --deep: #1a0a0e;
        --mauve: #7d3c4e;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        background: var(--deep);
        font-family: "Cormorant Garamond", serif;
        min-height: 100vh;
        overflow-x: hidden;
        cursor: default;
      }

      #petals-canvas {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 0;
      }

      #landing {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 100;
        background: radial-gradient(
          ellipse at center,
          #2d0a14 0%,
          #0d0305 100%
        );
      }

      #landing h1 {
        font-family: "Dancing Script", cursive;
        font-size: clamp(2.5rem, 6vw, 5rem);
        color: var(--blush);
        text-shadow: 0 0 40px rgba(192, 57, 59, 0.6);
        margin-bottom: 1rem;
        animation: pulse-glow 2s ease-in-out infinite;
      }

      #landing p {
        font-family: "Cormorant Garamond", serif;
        font-size: clamp(1rem, 2vw, 1.4rem);
        color: rgba(247, 202, 201, 0.7);
        letter-spacing: 0.15em;
        margin-bottom: 3rem;
        font-style: italic;
      }

      #open-btn {
        background: none;
        border: 1.5px solid var(--gold);
        color: var(--gold);
        font-family: "Cormorant Garamond", serif;
        font-size: 1.2rem;
        letter-spacing: 0.2em;
        padding: 1rem 3rem;
        cursor: pointer;
        transition: all 0.4s ease;
        text-transform: uppercase;
        position: relative;
        overflow: hidden;
      }

      #open-btn::before {
        content: "";
        position: absolute;
        inset: 0;
        background: var(--gold);
        transform: scaleX(0);
        transform-origin: left;
        transition: transform 0.4s ease;
        z-index: -1;
      }

      #open-btn:hover::before {
        transform: scaleX(1);
      }
      #open-btn:hover {
        color: var(--deep);
      }

      @keyframes pulse-glow {
        0%,
        100% {
          text-shadow: 0 0 40px rgba(192, 57, 59, 0.6);
        }
        50% {
          text-shadow: 0 0 80px rgba(192, 57, 59, 0.9),
            0 0 120px rgba(192, 57, 59, 0.4);
        }
      }

      #app {
        display: none;
        min-height: 100vh;
        position: relative;
        z-index: 1;
      }

      #envelopes-section {
        padding: 4rem 2rem;
        text-align: center;
      }

      #envelopes-section h2 {
        font-family: "Dancing Script", cursive;
        color: var(--blush);
        font-size: clamp(2rem, 4vw, 3.5rem);
        margin-bottom: 0.5rem;
        text-shadow: 0 0 30px rgba(192, 57, 59, 0.5);
      }

      #envelopes-section .subtitle {
        color: rgba(247, 202, 201, 0.5);
        font-style: italic;
        margin-bottom: 3rem;
        letter-spacing: 0.1em;
        font-size: 1.1rem;
      }

      .envelopes-grid {
        display: flex;
        flex-wrap: wrap;
        gap: 2rem;
        justify-content: center;
        max-width: 900px;
        margin: 0 auto;
      }

      .envelope-wrap {
        position: relative;
        width: 160px;
        height: 120px;
        cursor: pointer;
        transition: transform 0.3s ease;
      }

      .envelope-wrap:hover {
        transform: translateY(-8px) scale(1.05);
      }

      .envelope {
        width: 100%;
        height: 100%;
        position: relative;
      }

      .env-body {
        position: absolute;
        bottom: 0;
        width: 100%;
        height: 80%;
        border-radius: 4px 4px 8px 8px;
        border: 1.5px solid var(--gold);
      }

      .env-flap {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 60%;
        clip-path: polygon(0 0, 50% 60%, 100% 0);
        transform-origin: top center;
        transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        border-top: 1.5px solid var(--gold);
      }

      .envelope-wrap:hover .env-flap {
        transform: rotateX(160deg);
      }

      .env-number {
        position: absolute;
        bottom: 10px;
        left: 50%;
        transform: translateX(-50%);
        font-family: "Dancing Script", cursive;
        font-size: 1.4rem;
        color: var(--gold);
      }

      .env-heart {
        position: absolute;
        top: 30%;
        left: 50%;
        transform: translate(-50%, -50%);
        font-size: 1.8rem;
        animation: heartbeat 1.2s ease-in-out infinite;
      }

      @keyframes heartbeat {
        0%,
        100% {
          transform: translate(-50%, -50%) scale(1);
        }
        50% {
          transform: translate(-50%, -50%) scale(1.2);
        }
      }

      .env-1 .env-body,
      .env-1 .env-flap {
        background: linear-gradient(135deg, #6b1a2a, #3d0f17);
      }
      .env-2 .env-body,
      .env-2 .env-flap {
        background: linear-gradient(135deg, #4a1a3d, #220d1e);
      }
      .env-3 .env-body,
      .env-3 .env-flap {
        background: linear-gradient(135deg, #1a3d4a, #0d1e22);
      }
      .env-4 .env-body,
      .env-4 .env-flap {
        background: linear-gradient(135deg, #3d3d1a, #1e1e0d);
      }
      .env-5 .env-body,
      .env-5 .env-flap {
        background: linear-gradient(135deg, #1a4a1a, #0d220d);
      }
      .env-6 .env-body,
      .env-6 .env-flap {
        background: linear-gradient(135deg, #8b2500, #4a1400);
      }

      #letter-modal {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 200;
        background: rgba(10, 2, 5, 0.92);
        backdrop-filter: blur(8px);
        align-items: center;
        justify-content: center;
        padding: 1rem;
      }

      #letter-modal.show {
        display: flex;
        animation: fadeIn 0.4s ease;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }

      .letter-card {
        background: var(--cream);
        max-width: 700px;
        width: 100%;
        border-radius: 4px;
        position: relative;
        box-shadow: 0 30px 80px rgba(0, 0, 0, 0.8),
          0 0 0 1px rgba(201, 168, 76, 0.3);
        max-height: 90vh;
        overflow-y: auto;
        animation: slideUp 0.5s cubic-bezier(0.4, 0, 0.2, 1);
      }

      @keyframes slideUp {
        from {
          transform: translateY(60px);
          opacity: 0;
        }
        to {
          transform: translateY(0);
          opacity: 1;
        }
      }

      .letter-image-half {
        width: 100%;
        height: auto;
        max-height: 400px;
        object-fit: contain;
        background: #000;
      }

      .letter-image-placeholder {
        width: 100%;
        height: 340px;
        background: linear-gradient(135deg, #2d0a14, #1a0a0e);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        border-bottom: 3px solid var(--gold);
        color: rgba(247, 202, 201, 0.6);
        font-style: italic;
        gap: 0.5rem;
      }

      .letter-image-placeholder span {
        font-size: 3rem;
      }
      .letter-image-placeholder p {
        font-size: 0.95rem;
        letter-spacing: 0.05em;
      }

      .letter-body {
        padding: 2.5rem 3rem 2rem;
        background: repeating-linear-gradient(
          transparent,
          transparent 27px,
          rgba(192, 57, 59, 0.08) 28px
        );
        position: relative;
      }

      .letter-body::before {
        content: "";
        position: absolute;
        left: 3.5rem;
        top: 0;
        bottom: 0;
        width: 1px;
        background: rgba(192, 57, 59, 0.15);
      }

      .letter-number-tag {
        font-family: "Dancing Script", cursive;
        font-size: 1.1rem;
        color: var(--mauve);
        margin-bottom: 0.5rem;
        display: block;
      }

      .letter-body h3 {
        font-family: "Playfair Display", serif;
        font-size: clamp(1.4rem, 3vw, 2rem);
        color: var(--rose);
        margin-bottom: 1.2rem;
        line-height: 1.3;
      }

      .letter-body p {
        font-family: "Cormorant Garamond", serif;
        font-size: 1.15rem;
        line-height: 1.9;
        color: #3a1a1a;
        margin-bottom: 1rem;
      }

      .letter-sign {
        font-family: "Dancing Script", cursive;
        font-size: 1.8rem;
        color: var(--rose);
        text-align: right;
        margin-top: 1.5rem;
        padding-right: 1rem;
      }

      .letter-nav {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 1rem 2rem 1.5rem;
        background: var(--cream);
        border-top: 1px solid rgba(192, 57, 59, 0.15);
      }

      .nav-btn {
        background: none;
        border: 1.5px solid var(--rose);
        color: var(--rose);
        font-family: "Cormorant Garamond", serif;
        font-size: 1rem;
        letter-spacing: 0.1em;
        padding: 0.6rem 1.8rem;
        cursor: pointer;
        transition: all 0.3s ease;
        text-transform: uppercase;
      }

      .nav-btn:hover {
        background: var(--rose);
        color: var(--cream);
      }
      .nav-btn:disabled {
        opacity: 0.3;
        cursor: not-allowed;
      }
      .nav-btn:disabled:hover {
        background: none;
        color: var(--rose);
      }

      .letter-counter {
        font-family: "Dancing Script", cursive;
        color: var(--mauve);
        font-size: 1.1rem;
      }

      .close-btn {
        position: absolute;
        top: 1rem;
        right: 1rem;
        background: rgba(0, 0, 0, 0.5);
        border: none;
        color: var(--blush);
        width: 36px;
        height: 36px;
        border-radius: 50%;
        font-size: 1.2rem;
        cursor: pointer;
        z-index: 10;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: background 0.2s;
      }

      .close-btn:hover {
        background: var(--rose);
      }

      #all-done {
        display: none;
        text-align: center;
        padding: 4rem 2rem;
        color: var(--blush);
      }

      #all-done.show {
        display: block;
      }

      #all-done h2 {
        font-family: "Dancing Script", cursive;
        font-size: clamp(2rem, 5vw, 4rem);
        margin-bottom: 1rem;
        color: var(--gold);
        animation: pulse-glow 2s infinite;
      }

      #all-done p {
        font-style: italic;
        font-size: 1.2rem;
        opacity: 0.8;
      }

      .letter-card::-webkit-scrollbar {
        width: 6px;
      }
      .letter-card::-webkit-scrollbar-track {
        background: var(--cream);
      }
      .letter-card::-webkit-scrollbar-thumb {
        background: var(--rose);
        border-radius: 3px;
      }

      .confetti-piece {
        position: fixed;
        width: 10px;
        height: 10px;
        top: -10px;
        border-radius: 2px;
        animation: confettiFall linear forwards;
        pointer-events: none;
        z-index: 999;
      }

      @keyframes confettiFall {
        to {
          transform: translateY(100vh) rotate(720deg);
          opacity: 0;
        }
      }

      #stars {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 0;
        overflow: hidden;
      }

      .star {
        position: absolute;
        background: white;
        border-radius: 50%;
        animation: twinkle var(--dur) ease-in-out infinite;
      }

      @keyframes twinkle {
        0%,
        100% {
          opacity: 0.1;
          transform: scale(1);
        }
        50% {
          opacity: 0.8;
          transform: scale(1.5);
        }
      }
    </style>
  </head>
  <body>
    <canvas id="petals-canvas"></canvas>
    <div id="stars"></div>

    <div id="landing">
      <h1>🌙 Goodnight, My Love...</h1>
      <p>twelve letters, written just for tonight</p>
      <button id="open-btn" onclick="startApp()">Open Your Letters</button>
    </div>

    <div id="app">
      <div id="envelopes-section">
        <h2>Tonight's Letters 🌹</h2>
        <p class="subtitle">Each one written thinking only of you</p>
        <div class="envelopes-grid" id="grid"></div>
      </div>

      <div id="all-done">
        <h2>Sweet Dreams, My Love 🌙</h2>
        <p>
          Close your eyes knowing you are completely adored.<br />
          I'll be here when the morning finds you.
        </p>
      </div>
    </div>

    <div id="letter-modal">
      <div class="letter-card" id="letter-card">
        <button class="close-btn" onclick="closeModal()">✕</button>
        <div id="letter-photo-area"></div>
        <div class="letter-body" id="letter-body-content"></div>
        <div class="letter-nav">
          <button class="nav-btn" id="prev-btn" onclick="navigate(-1)">
            ← Prev
          </button>
          <span class="letter-counter" id="letter-counter"></span>
          <button class="nav-btn" id="next-btn" onclick="navigate(1)">
            Next →
          </button>
        </div>
      </div>
    </div>

    <script>
      const letters = [
        {
          title: "Before You Sleep",
          opening: "Suad,",
          body: `Before you close your eyes tonight, I need you to know something.

You were on my mind all day. Not in a passing way — in the way that stays, that lingers in every quiet moment between tasks and thoughts.

The world was loud today. But in the middle of it, there was always this still, warm place that belongs only to you.

That place is where I put every thought of you.

Go to sleep knowing you are held there — gently, completely, and with so much tenderness.

Goodnight, my love.`,
          sign: "Yours, always",
          image: "images/suad1.jpeg",
        },
        {
          title: "The Way You Undo Me",
          opening: "My Suad,",
          body: `There is something about you that completely undoes me.

It is not one thing — it is all of it. The way you carry yourself. The warmth in your eyes when you smile. The softness of your voice when you are comfortable and unguarded.

I find myself undone by all of it.

And the strangest part? I do not want to be put back together. Not without you.

Sleep well tonight, love. You deserve the deepest, most peaceful rest.`,
          sign: "Helplessly yours",
          image: "images/suad2.jpeg",
        },
        {
          title: "If I Were There",
          opening: "Suad…",
          body: `If I were there with you right now —

I would dim the lights low. Put on something soft that floats through the room like a whisper. I would sit close enough that you could feel the warmth of me beside you.

I would not say much. I would just be there.

My hand finding yours. Your head, if you let it, resting somewhere near my shoulder.

The night quiet around us.

That is all I want. Just that closeness with you.

Dream of me tonight.`,
          sign: "Right beside you in every thought",
          image: "images/suad3.jpeg",
        },
        {
          title: "What I Notice",
          opening: "Beautiful Suad,",
          body: `I notice things about you that I don't think you even realize.

The way your energy shifts when something excites you — your whole face opens up, and it is the most captivating thing.

The way you laugh when something catches you off guard. Fully, completely, without holding back.

The way your eyes go soft when you feel safe.

I notice all of it.

And every single thing I notice makes me want to know more. Want to be closer. Want to be the person who gets to see all the versions of you.

Sleep beautifully tonight.`,
          sign: "Paying attention, always",
          image: "images/suad4.jpeg",
        },
        {
          title: "Tonight's Confession",
          opening: "Suad,",
          body: `Here is something I want to confess to you at the end of this day:

I thought about kissing you today.

Not in a rushed way — in the slow, intentional way. The kind where time stops and there is nothing else in the world except that moment between us.

I thought about what it would feel like. Your breath, warm and close. The world going completely still.

I think about it more than you know.

Goodnight, love. I hope that thought finds you in your dreams.`,
          sign: "Confessing everything",
          image: "images/suad5.jpeg",
        },
        {
          title: "The Scent of You",
          opening: "My love,",
          body: `I keep thinking about the last time we were close enough that I could catch the faintest scent of you.

It does something to me I cannot fully explain. It is warm and soft and entirely, unmistakably you.

It stays with me.

Long after we have gone our separate ways, it lingers — a quiet, beautiful reminder that you are real and you are mine and you are everything.

Go to sleep, my love. Let the night hold you the way I wish I could right now.`,
          sign: "Wrapped in thoughts of you",
          image: "images/suad6.jpeg",
        },
        {
          title: "Your Body is Art",
          opening: "Suad,",
          body: `I want you to know something, and I want you to really hear it:

You are stunning.

Not just beautiful in the conventional, surface-level way — though you absolutely are that too. I mean stunning in the way that stops thought. In the way that makes a person catch their breath.

The curve of your smile. The line of your neck. The way you move through a room with this quiet, unconscious grace.

You are art, Suad.

And I am endlessly grateful to be someone who gets to look at you.

Sleep well, gorgeous.`,
          sign: "Completely in awe of you",
          image: "images/suad7.jpeg",
        },
        {
          title: "When the Night is Quiet",
          opening: "My Suad,",
          body: `In the quiet of the night, when everything slows down and the world stops demanding things from you —

That is when I think of you most.

I imagine you relaxed. Soft. All the tension of the day finally released from your shoulders. Your breathing slow and even.

I imagine being there in that quiet with you. Close. Warm. The kind of closeness that does not need words — just presence.

That is the dream I keep coming back to.

You and me. Quiet. Completely at peace together.

Goodnight, love.`,
          sign: "In the quiet, always yours",
          image: "images/suad8.jpeg",
        },
        {
          title: "I Want to Know All of You",
          opening: "Suad…",
          body: `I want to know everything about you.

The things that keep you up at night. The dreams that make you smile in your sleep. What makes you feel completely, deeply safe.

I want to know the version of you that only comes out in the small hours — honest, unhurried, unedited.

I want to learn the map of who you are and memorize every part of it.

Because I believe you are extraordinary. And extraordinary things deserve to be truly, fully known.

Tell me more of yourself, always. I am always listening.

Goodnight, beautiful.`,
          sign: "Wanting all of you",
          image: "images/suad9.jpeg",
        },
        {
          title: "The Pull Between Us",
          opening: "My love,",
          body: `You feel it too, don't you?

That pull. That invisible thread that draws me toward you whenever we are in the same space.

I feel it in the pause before one of us speaks. In the way a moment between us can stretch out longer than it should and neither of us moves to end it.

It is magnetic. It is undeniable.

And every single time I feel it, I think — this is something rare. This does not happen with just anyone.

This is ours.

Dream deeply tonight, Suad. Dream of what is between us.`,
          sign: "Pulled toward you, always",
          image: "images/suad10.jpeg",
        },
        {
          title: "What I Would Do",
          opening: "Suad,",
          body: `If tonight I could be anywhere in the world, I would choose wherever you are.

I would come to you quietly. I would make sure you were warm. I would sit close enough that the space between us was nothing at all.

And when the night grew late and your eyes grew heavy, I would stay.

I would watch over your sleep the way the moon watches over the sea — steadily, faithfully, without wanting anything in return.

That is what you do to someone who loves you the way I do.

Goodnight, my entire heart.`,
          sign: "Here, even in the distance",
          image: "images/suad11.jpeg",
        },
        {
          title: "Until Morning",
          opening: "My Suad,",
          body: `This is the last letter for tonight.

And I want to end it by telling you what I most want you to carry into your sleep:

You are loved. Completely. Without condition or reservation.

You are wanted — not just physically, though God, yes, that too — but in every way a person can be wanted. Your mind. Your spirit. Your laughter. Your silence. All of it.

Close your eyes tonight knowing that somewhere, I am thinking of you. Smiling at the thought of you. Grateful beyond words that you exist and that somehow you are mine.

Sleep softly, love.

I will be the first thought you have when morning comes.`,
          sign: "Yours until morning, and after",
          image: "images/suad12.jpeg",
        },
      ];

      let currentIndex = 0;
      let openedSet = new Set();

      function startApp() {
        document.getElementById("landing").style.opacity = "0";
        document.getElementById("landing").style.transition =
          "opacity 0.8s ease";
        setTimeout(() => {
          document.getElementById("landing").style.display = "none";
          document.getElementById("app").style.display = "block";
          buildGrid();
          spawnStars();
          startPetals();
        }, 800);
      }

      function buildGrid() {
        const grid = document.getElementById("grid");
        const colorClasses = [
          "env-1",
          "env-2",
          "env-3",
          "env-4",
          "env-5",
          "env-6",
        ];
        letters.forEach((_, i) => {
          const wrap = document.createElement("div");
          wrap.className = "envelope-wrap";
          wrap.id = `env-${i}`;
          wrap.onclick = () => openEnvelope(i);
          wrap.innerHTML = `
            <div class="envelope ${colorClasses[i % colorClasses.length]}">
              <div class="env-flap"></div>
              <div class="env-body"></div>
              <span class="env-heart">💌</span>
              <span class="env-number">${i + 1}</span>
            </div>`;
          grid.appendChild(wrap);
        });
      }

      function openEnvelope(index) {
        openedSet.add(index);
        currentIndex = index;
        shootConfetti();
        showLetter(index);
      }

      function showLetter(index) {
        const letter = letters[index];

        const photoArea = document.getElementById("letter-photo-area");
        if (letter.image) {
          photoArea.innerHTML = `<img class="letter-image-half" src="${letter.image}" alt="My love">`;
        } else {
          photoArea.innerHTML = `
            <div class="letter-image-placeholder">
              <span>📸</span>
              <p>Add her photo here</p>
            </div>`;
        }

        document.getElementById("letter-body-content").innerHTML = `
          <span class="letter-number-tag">Letter ${index + 1} of ${
          letters.length
        }</span>
          <h3>${letter.title}</h3>
          <p>${letter.opening}</p>
          <p>${letter.body
            .replace(/\n\n/g, "</p><p>")
            .replace(/\n/g, "<br>")}</p>
          <div class="letter-sign">${letter.sign}</div>`;

        document.getElementById("letter-counter").textContent = `${
          index + 1
        } / ${letters.length}`;
        document.getElementById("prev-btn").disabled = index === 0;
        document.getElementById("next-btn").disabled =
          index === letters.length - 1;

        const modal = document.getElementById("letter-modal");
        modal.classList.add("show");
        document.getElementById("letter-card").scrollTop = 0;

        if (openedSet.size === letters.length) {
          setTimeout(() => {
            document.getElementById("all-done").classList.add("show");
          }, 600);
        }
      }

      function navigate(dir) {
        const newIndex = currentIndex + dir;
        if (newIndex < 0 || newIndex >= letters.length) return;
        openedSet.add(newIndex);
        currentIndex = newIndex;
        const card = document.getElementById("letter-card");
        card.style.opacity = "0";
        card.style.transform = `translateX(${dir > 0 ? "30px" : "-30px"})`;
        card.style.transition = "all 0.25s ease";
        setTimeout(() => {
          showLetter(newIndex);
          card.style.opacity = "1";
          card.style.transform = "translateX(0)";
        }, 250);
      }

      function closeModal() {
        document.getElementById("letter-modal").classList.remove("show");
      }

      document
        .getElementById("letter-modal")
        .addEventListener("click", function (e) {
          if (e.target === this) closeModal();
        });

      function shootConfetti() {
        const colors = [
          "#c0393b",
          "#c9a84c",
          "#f7cac9",
          "#7d3c4e",
          "#ffffff",
          "#ff6b8a",
        ];
        for (let i = 0; i < 60; i++) {
          const el = document.createElement("div");
          el.className = "confetti-piece";
          el.style.cssText = `
            left: ${Math.random() * 100}vw;
            background: ${colors[Math.floor(Math.random() * colors.length)]};
            width: ${6 + Math.random() * 8}px;
            height: ${6 + Math.random() * 8}px;
            border-radius: ${Math.random() > 0.5 ? "50%" : "2px"};
            animation-duration: ${1.5 + Math.random() * 2}s;
            animation-delay: ${Math.random() * 0.5}s;
          `;
          document.body.appendChild(el);
          setTimeout(() => el.remove(), 3000);
        }
      }

      function spawnStars() {
        const container = document.getElementById("stars");
        for (let i = 0; i < 80; i++) {
          const s = document.createElement("div");
          s.className = "star";
          const size = 1 + Math.random() * 2.5;
          s.style.cssText = `
            width: ${size}px; height: ${size}px;
            left: ${Math.random() * 100}%; top: ${Math.random() * 100}%;
            --dur: ${2 + Math.random() * 4}s;
            animation-delay: ${Math.random() * 4}s;
          `;
          container.appendChild(s);
        }
      }

      function startPetals() {
        const canvas = document.getElementById("petals-canvas");
        const ctx = canvas.getContext("2d");
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        window.addEventListener("resize", () => {
          canvas.width = window.innerWidth;
          canvas.height = window.innerHeight;
        });

        const petals = Array.from({ length: 30 }, () => ({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height - canvas.height,
          r: 4 + Math.random() * 6,
          speed: 0.5 + Math.random() * 1,
          drift: (Math.random() - 0.5) * 0.5,
          rot: Math.random() * Math.PI * 2,
          rotSpeed: (Math.random() - 0.5) * 0.04,
          opacity: 0.3 + Math.random() * 0.5,
          color: Math.random() > 0.5 ? "#c0393b" : "#f7cac9",
        }));

        function draw() {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          petals.forEach((p) => {
            ctx.save();
            ctx.translate(p.x, p.y);
            ctx.rotate(p.rot);
            ctx.globalAlpha = p.opacity;
            ctx.fillStyle = p.color;
            ctx.beginPath();
            ctx.ellipse(0, 0, p.r, p.r * 0.6, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
            p.y += p.speed;
            p.x += p.drift;
            p.rot += p.rotSpeed;
            if (p.y > canvas.height + 20) {
              p.y = -20;
              p.x = Math.random() * canvas.width;
            }
          });
          requestAnimationFrame(draw);
        }
        draw();
      }
    </script>
  </body>
</html>
